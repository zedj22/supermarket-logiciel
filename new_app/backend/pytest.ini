[pytest]
asyncio_mode = auto
testpaths = tests
# Phase L2-D: the offline License Generator lives in `tools/` (never part
# of the `app*` package that ships to customers) and must be importable
# from the test suite without any sys.path surgery in individual files.
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    default::RuntimeWarning
