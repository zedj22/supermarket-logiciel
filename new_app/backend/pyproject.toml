[project]
name = "supermarket-pro-backend"
version = "0.1.0"
description = "Supermarket Pro - FastAPI Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0,<2.1",  # 2.1 makes postgresql:// use psycopg3; code is psycopg2
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # R5: run_production.py reads <DATA_DIR>/config/.env directly with
    # dotenv_values (R4 §5 handoff) — a direct import, not just transitive.
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    # Phase L2-A: Ed25519 license verification is a direct application
    # dependency (not merely transitive via python-jose) — the Lifetime
    # activation path imports it unconditionally.
    "cryptography>=42.0.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "structlog>=23.2.0",
    # Phase 15 (G7 spike + approved architecture): PDF rendering, Arabic shaping, RTL bidi.
    "reportlab>=4.0.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
    # Phase 15 XLSX exports (approved after the G7 gate).
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    # Test-only: PDF geometry assertions in test_export_render.py and
    # test_phase7_facturation_pdf.py (never imported by app/).
    "pymupdf>=1.26.0",
    # setuptools is imported by the customer-package boundary tests and
    # is no longer bundled in Python 3.12+ venvs.
    "setuptools>=68.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:httpx.*",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
