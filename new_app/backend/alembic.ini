# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# sys.path prepend
prepend_sys_path = .

# template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python>=3.9 or backports.zoneinfo library.
# Any required timezone provider packages should be listed in requirements.
# Leaving blank will use UTC.
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .hierarchical_revision to
# work. Note that if the revision has been merged, this
# flag is set to False automatically by alembic
# hierarchical = false

[post_write_hooks]

# Logging configuration for Alembic
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# Environment configuration — reads from .env
# The DATABASE_URL is resolved at migration time
[alembic:exclude]

# Tables that Alembic should ignore during autogenerate
# (add table names here if you need to exclude system tables)
